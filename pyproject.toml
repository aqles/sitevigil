[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sitevigil"
version = "0.9.0"
description = "One-command website security audit for humans and AI agents: security headers, cookies, TLS, CORS and exposed files, scored 0-100 with a concrete fix for every finding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "audit", "headers", "mcp", "cli", "tls"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
authors = [{ name = "Aql", email = "aql@ednasalam.com" }]

[project.scripts]
sitevigil = "sitevigil.cli:main"

[project.urls]
Homepage = "https://github.com/aqles/sitevigil"

[tool.setuptools.packages.find]
where = ["src"]
